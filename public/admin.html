<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم — إعلاناتي</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon.ico">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#0d2c52">
<link rel="stylesheet" href="/shared.css">
<style>
main.wrap{padding:20px 0 60px}
.tabs2{display:flex;gap:8px;margin-bottom:18px;background:#eef2f6;padding:5px;border-radius:12px;max-width:340px}
.tabs2 button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font:inherit;font-weight:800;cursor:pointer;color:#5b6b80;font-size:13px}
.tabs2 button.active{background:#09284d;color:#fff}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;color:#38516f;cursor:pointer}
.filters button.active{background:#09284d;color:#fff;border-color:#09284d}
.zoomBtns{display:flex;gap:4px}
.zoomBtns button{background:#ffffff1a;border:1px solid #ffffff33;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;font-weight:800;font-size:12px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:11px 12px;text-align:right;font-size:13px;border-bottom:1px solid var(--line)}
th{background:#f6f8fb;font-size:12px;color:var(--muted)}
tr:last-child td{border-bottom:0}
.adthumb{width:46px;height:46px;border-radius:8px;object-fit:cover;background:#eef2f6}
.rowActions{display:flex;gap:6px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#00000070;display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.show{display:flex}
.modalcard{background:#fff;border-radius:18px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.modalcard img{width:100%;border-radius:12px;margin-bottom:12px}
</style>
</head>
<body>
<header class="topbar"><div class="wrap topbar-row">
  <a class="brand" href="/admin"><img src="/icons/header-logo.png" alt="شعار إعلاناتي"><div><h1>إعلاناتي</h1><p>لوحة تحكم المشرف</p></div></a>
  <div class="topbar-actions">
    <div class="zoomBtns"><button id="fontDecBtn" title="تصغير الخط">A-</button><button id="fontIncBtn" title="تكبير الخط">A+</button></div>
    <span id="whoami"></span>
    <a class="pillbtn gold" href="/app">＋ إعلان جديد</a>
    <a class="pillbtn" href="#" id="logoutBtn">تسجيل الخروج</a>
  </div>
</div></header>

<main class="wrap">
  <div class="tabs2">
    <button id="tabAds" class="active">إعلانات الزوار</button>
    <button id="tabUsers">المستخدمون</button>
  </div>

  <div id="adsPane">
    <div class="filters" id="statusFilters">
      <button data-f="all" class="active">الكل</button>
      <button data-f="pending">قيد المراجعة</button>
      <button data-f="approved">معتمد</button>
      <button data-f="rejected">مرفوض</button>
    </div>
    <table>
      <thead><tr><th></th><th>العنوان</th><th>القسم</th><th>صاحب الإعلان</th><th>الحالة</th><th>تاريخ الإنشاء</th><th>إجراءات</th></tr></thead>
      <tbody id="adsBody"></tbody>
    </table>
    <div class="empty" id="adsEmpty" style="display:none"><span class="ic">📭</span>لا توجد إعلانات مطابقة.</div>
  </div>

  <div id="usersPane" style="display:none">
    <table>
      <thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>عدد الإعلانات</th><th>تاريخ التسجيل</th><th>الحالة</th><th>إجراءات</th></tr></thead>
      <tbody id="usersBody"></tbody>
    </table>
    <div class="empty" id="usersEmpty" style="display:none"><span class="ic">👤</span>لا يوجد مستخدمون بعد.</div>
  </div>
</main>

<div class="modal" id="previewModal"><div class="modalcard">
  <img id="previewImg" alt="معاينة الإعلان">
  <button class="btn ghost" onclick="closePreview()">إغلاق</button>
</div></div>
<div class="toast" id="toast"></div>

<script src="/poster-engine.js"></script>
<script src="/shared.js"></script>
<script>
const PE=window.PosterEngine;
const $=id=>document.getElementById(id);
let allAds=[], statusFilter="all";

function toast(msg,type){const t=$("toast");t.textContent=msg;t.className="toast show"+(type?(" "+type):"");setTimeout(()=>t.className="toast",2600)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(ts){return new Date(ts).toLocaleDateString("ar-EG",{year:"numeric",month:"short",day:"numeric"})}
function statusLabel(s){return s==="approved"?"معتمد":s==="rejected"?"مرفوض":"قيد المراجعة"}

async function boot(){
  try{
    const r=await fetch("/api/me");
    if(!r.ok){location.href="/";return}
    const d=await r.json();
    if(d.user.role!=="admin"){location.href="/app";return}
    $("whoami").textContent="مرحبًا، "+d.user.name;
  }catch(e){location.href="/";return}
  await loadAds(); await loadUsers();
}
$("logoutBtn").onclick=async(e)=>{e.preventDefault();await fetch("/api/logout",{method:"POST"});location.href="/"};

$("tabAds").onclick=()=>{$("tabAds").classList.add("active");$("tabUsers").classList.remove("active");$("adsPane").style.display="block";$("usersPane").style.display="none"};
$("tabUsers").onclick=()=>{$("tabUsers").classList.add("active");$("tabAds").classList.remove("active");$("usersPane").style.display="block";$("adsPane").style.display="none"};

document.querySelectorAll("#statusFilters button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("#statusFilters button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active"); statusFilter=b.dataset.f; renderAds();
});

async function loadAds(){
 const r=await fetch("/api/ads?all=1");
 if(!r.ok) return;
 const d=await r.json(); allAds=d.ads; renderAds();
}
function renderAds(){
 const list = statusFilter==="all" ? allAds : allAds.filter(a=>a.status===statusFilter);
 $("adsEmpty").style.display = list.length? "none":"block";
 $("adsBody").innerHTML = list.map(ad=>{
  const c=PE.configs[ad.category]||PE.configs.realestate;
  const title=(ad.fields&&ad.fields.title)||"بدون عنوان";
  const thumb = ad.images&&ad.images[0] ? `<img class="adthumb" src="${ad.images[0].url}">` : `<div class="adthumb" style="display:flex;align-items:center;justify-content:center">—</div>`;
  return `<tr>
   <td>${thumb}</td>
   <td>${escapeHtml(title)}</td>
   <td>${c.label}</td>
   <td>${escapeHtml(ad.ownerName)}<br><span style="color:var(--muted);font-size:11px">${escapeHtml(ad.ownerEmail)}</span></td>
   <td><span class="badge ${ad.status}">${statusLabel(ad.status)}</span></td>
   <td>${fmtDate(ad.createdAt)}</td>
   <td><div class="rowActions">
     <button class="btn ghost sm" onclick="previewAd('${ad.id}')">👁 معاينة</button>
     ${ad.status!=="approved"?`<button class="btn sm" style="background:#e4f7ec;color:#1e8e5a" onclick="setStatus('${ad.id}','approved')">✔ اعتماد</button>`:""}
     ${ad.status!=="rejected"?`<button class="btn sm" style="background:#fdecea;color:#c0392b" onclick="setStatus('${ad.id}','rejected')">✕ رفض</button>`:""}
     <button class="btn danger sm" onclick="deleteAd('${ad.id}')">🗑 حذف</button>
   </div></td>
  </tr>`;
 }).join("");
}
window.setStatus=async function(id,status){
 const r=await fetch(`/api/ads/${id}/status`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});
 if(r.ok){toast("تم تحديث حالة الإعلان","ok");loadAds()}else toast("تعذر التحديث","err");
};
window.deleteAd=async function(id){
 if(!confirm("حذف هذا الإعلان نهائيًا؟")) return;
 const r=await fetch("/api/ads/"+id,{method:"DELETE"});
 if(r.ok){toast("تم الحذف","ok");loadAds()}else toast("تعذر الحذف","err");
};
window.previewAd=async function(id){
 const ad=allAds.find(a=>a.id===id); if(!ad) return;
 try{
  const cv=await PE.renderExportCanvas(ad);
  $("previewImg").src=cv.toDataURL("image/png");
  $("previewModal").classList.add("show");
 }catch(e){console.error(e);toast("تعذر إنشاء المعاينة","err")}
};
window.closePreview=function(){$("previewModal").classList.remove("show")};
$("previewModal").onclick=(e)=>{if(e.target.id==="previewModal") closePreview()};

async function loadUsers(){
 const r=await fetch("/api/users");
 if(!r.ok) return;
 const d=await r.json();
 $("usersEmpty").style.display = d.users.length? "none":"block";
 $("usersBody").innerHTML = d.users.map(u=>`<tr>
  <td>${escapeHtml(u.name)}</td>
  <td>${escapeHtml(u.email)}</td>
  <td>${u.adsCount}</td>
  <td>${fmtDate(u.createdAt)}</td>
  <td><span class="badge ${u.disabled?'rejected':'approved'}">${u.disabled?'موقوف':'نشط'}</span></td>
  <td><div class="rowActions">
    <button class="btn ghost sm" onclick="toggleUser('${u.id}')">${u.disabled?'تفعيل':'إيقاف'}</button>
    <button class="btn danger sm" onclick="deleteUser('${u.id}')">🗑 حذف الحساب</button>
  </div></td>
 </tr>`).join("");
}
window.toggleUser=async function(id){
 const r=await fetch(`/api/users/${id}/toggle`,{method:"POST"});
 if(r.ok){toast("تم التحديث","ok");loadUsers()}else toast("تعذر التحديث","err");
};
window.deleteUser=async function(id){
 if(!confirm("حذف هذا الحساب وكل إعلاناته نهائيًا؟")) return;
 const r=await fetch("/api/users/"+id,{method:"DELETE"});
 if(r.ok){toast("تم حذف الحساب","ok");loadUsers();loadAds()}else toast("تعذر الحذف","err");
};

boot();
</script>
</body></html>
